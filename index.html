<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090B" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="AuraWave - مشغل موسيقى PWA عصري، أوفلاين بالكامل مع AutoMix وكلمات متزامنة" />
    
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AuraWave" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./icons/icon-192.png" />

    <!-- Local High-Performance Self-Hosted Arabic & Latin Fonts (100% Offline) -->
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <title>AuraWave — Future Audio Experience</title>

    <!-- Instant Client Cache Invalidation: purges stale SW caches on version bump -->
    <script>
      (function() {
        var APP_VERSION = 'v30.0';
        var stored = localStorage.getItem('aura_sw_ver');
        if (stored !== APP_VERSION) {
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          localStorage.setItem('aura_sw_ver', APP_VERSION);
          if (stored) {
            window.location.reload();
          }
        }
      })();
    </script>
    <style>
      html {
        background-color: #09090B !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: -webkit-fill-available;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      body {
        background-color: #09090B !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        background-color: #09090B !important;
        margin: 0;
        padding: 0;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #full-bleed-backdrop {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-color: #09090B;
        pointer-events: none;
      }
    </style>

  <body class="bg-[#09090B] text-[#f4f4f7] antialiased selection:bg-[#FA2D48]/30 selection:text-white overflow-hidden font-sans">
    <div id="full-bleed-backdrop" aria-hidden="true"></div>
    <div id="root">

        <div style="margin-top: 20px; font-weight: 700; font-size: 15px; letter-spacing: 0.05em; color: #e4e4e7;">AURA<span style="color: #FA2D48;">.WAV</span></div>
        <p style="margin-top: 6px; font-size: 12px; color: #71717a;">جاري بدء المشغل الصوتي...</p>
        <style>@keyframes auraSpin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
