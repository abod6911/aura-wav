<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#060609" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="AURA.WAV - مشغل موسيقى PWA عصري، أوفلاين بالكامل مع AutoMix وكلمات متزامنة" />
    
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-192.png" />

    <!-- Local High-Performance Self-Hosted Arabic & Latin Fonts (100% Offline) -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>AURA.WAV — Future Audio Experience</title>

    <!-- Instant Client Cache Invalidation: purges stale SW caches on version bump -->
    <script>
      (function() {
        var APP_VERSION = 'v13.0';
        var stored = localStorage.getItem('aura_sw_ver');
        if (stored !== APP_VERSION) {
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          localStorage.setItem('aura_sw_ver', APP_VERSION);
          if (stored) {
            window.location.reload();
          }
        }
      })();
    </script>
    <style>
      html, body {
        background-color: #060609 !important;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body class="bg-[#060609] text-[#f4f4f7] antialiased selection:bg-[#FA243C]/30 selection:text-white overflow-hidden font-sans">
    <div id="root">
      <div id="app-splash" style="min-height: 100vh; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #060609; color: #f4f4f5; font-family: 'Readex Pro', sans-serif;">
        <div style="width: 44px; height: 44px; border: 3.5px solid rgba(250, 36, 60, 0.2); border-top-color: #FA243C; border-radius: 50%; animation: auraSpin 0.9s linear infinite;"></div>
        <div style="margin-top: 20px; font-weight: 700; font-size: 15px; letter-spacing: 0.05em; color: #e4e4e7;">AURA<span style="color: #FA243C;">.WAV</span></div>
        <p style="margin-top: 6px; font-size: 12px; color: #71717a;">جاري بدء المشغل الصوتي...</p>
        <style>@keyframes auraSpin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
