<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="512" height="512" rx="128" fill="#09090b" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" />

  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#auraGrad)" stroke-width="3" stroke-dasharray="8 12" opacity="0.4" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- Center Soundwave / Frequency Aura -->
  <g transform="translate(256, 256)">
    <!-- Equalizer Vertical Bars -->
    <rect x="-100" y="-30" width="12" height="60" rx="6" fill="url(#auraGrad)" opacity="0.7" />
    <rect x="-70" y="-60" width="12" height="120" rx="6" fill="url(#auraGrad)" opacity="0.85" />
    <rect x="-40" y="-95" width="12" height="190" rx="6" fill="url(#auraGrad)" />
    <rect x="-10" y="-120" width="12" height="240" rx="6" fill="#ffffff" />
    <rect x="20" y="-85" width="12" height="170" rx="6" fill="url(#auraGrad)" />
    <rect x="50" y="-55" width="12" height="110" rx="6" fill="url(#auraGrad)" opacity="0.85" />
    <rect x="80" y="-25" width="12" height="50" rx="6" fill="url(#auraGrad)" opacity="0.7" />
  </g>
</svg>
